<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GrammarSpace: short, focused lessons that turn confusing grammar rules into skills you will use every day."
    />
    <title>GrammarSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=M+PLUS+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved colour theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('gs-theme')
        document.documentElement.dataset.theme =
          saved === 'purple' || saved === 'red' ? saved : 'blue'
      } catch (e) {
        document.documentElement.dataset.theme = 'blue'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
